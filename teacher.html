<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청평초 단원평가 · 교사</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2a44;--muted:#5b6478;--line:#dde3eb;--ok:#0e7c66;--ok-soft:#dff3ec;--warn:#c2571a;--warn-soft:#fde9dc;--half-soft:#fbf1cf;--sky:#2f6fb0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:4px 0}
h2{font-size:18px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.summary div{background:var(--bg);border-radius:8px;padding:12px}
.summary b{font-size:26px;display:block}
.bars{display:grid;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:160px 1fr 110px;gap:10px;align-items:center}
.track{height:14px;background:var(--line);border-radius:7px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.track s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--muted);position:sticky;top:0;background:var(--card)}
td.s{text-align:center;font-weight:600;border-radius:4px}
td.ok{background:var(--ok-soft);color:var(--ok)} td.need{background:var(--warn-soft);color:var(--warn)} td.none{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tabs button,.btn{font-weight:600;font-size:14px;font-family:inherit;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.ans{background:var(--bg);padding:8px 10px;border-radius:6px;white-space:pre-wrap}
.model{color:var(--muted);font-size:13px}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.muted{color:var(--muted)}
.err{background:var(--warn-soft);color:var(--warn);padding:14px;border-radius:8px}
.filter{display:flex;gap:8px;align-items:center;margin:8px 0}
select{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중…</p></main>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.__gis=1;window.dispatchEvent(new Event('gis-loaded'))"></script>
<script src="api.js"></script>
<script>
let D = null, tab = 'students', conceptFilter = '', unitId = decodeURIComponent(location.hash.slice(1)) || '';
const $ = document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pct(x){return x==null?'–':Math.round(x*100)+'%';}
function call(fn, ...args){ return api(fn, ...args); }
function cname(id){return D.concepts.find(c=>c.id===id).name;}

async function load(){
  $.innerHTML='<p class="muted">불러오는 중…</p>';
  try{ D = await call('getDashboard', unitId); unitId = D.unit.id; if(location.hash.slice(1)!==unitId) history.replaceState(null,'','#'+unitId); render(); }catch(e){ $.innerHTML=`<div class="err">${esc(e.message||e)}</div>`; }
}

function render(){
  const st = D.students, n = st.length;
  const done = st.filter(s=>s.mastered).length;
  const avg = D.concepts.map((c,i)=>{
    const v = st.map(s=>s.scores[i]).filter(x=>x!=null);
    const ok = st.filter(s=>s.scores[i]!=null && s.scores[i]>=D.mastery).length;
    return {c, avg: v.length? v.reduce((a,b)=>a+b,0)/v.length : null, ok, n:v.length};
  });
  const weakest = avg.filter(a=>a.avg!=null).sort((a,b)=>a.ok/a.n - b.ok/b.n)[0];

  $.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
    <div><label class="muted" for="unitSel">단원</label>
      <select id="unitSel" onchange="unitId=this.value;conceptFilter='';history.replaceState(null,'','#'+unitId);load()" style="display:block;font-size:16px;margin:2px 0 6px">
        ${D.units.map(u=>`<option value="${esc(u.id)}" ${u.id===D.unit.id?'selected':''}>${esc(u.subject)} ${esc(u.term)} · ${esc(u.no)}. ${esc(u.title)}</option>`).join('')}
      </select>
      <h1>${esc(D.unit.title)} · 학급 현황</h1><p class="lead">완전학습 기준: 개념별 ${pct(D.mastery)} 이상</p></div>
    <div style="display:flex;gap:6px"><button class="btn" onclick="load()">새로고침</button><a class="btn" href="index.html" style="text-decoration:none">학생 화면</a><button class="btn" onclick="signOut()">로그아웃</button></div>
  </div>
  <div class="card summary">
    <div><span class="muted">응시한 학생</span><b>${n}명</b></div>
    <div><span class="muted">완전학습 달성</span><b>${done}명</b></div>
    <div><span class="muted">서술형 확인 대기</span><b>${D.review.length}건</b></div>
    <div><span class="muted">가장 많이 막힌 개념</span><b style="font-size:18px">${weakest?esc(weakest.c.name):'–'}</b></div>
  </div>
  <div class="card">
    <h2>개념별 완전학습 비율</h2>
    <p class="lead">막대는 평균 점수, 세로선은 기준(${pct(D.mastery)})입니다.</p>
    <div class="bars">${avg.map(a=>`<div class="bar"><span>${esc(a.c.name)}</span>
      <div class="track"><i style="width:${(a.avg||0)*100}%"></i><s style="left:${D.mastery*100}%"></s></div>
      <span>${a.n?`${a.ok}/${a.n}명 달성`:'응시 없음'}</span></div>`).join('')}</div>
  </div>
  <div class="tabs" role="tablist">
    ${[['students','학생별 현황'],['items','문항 분석'],['review',`서술형 확인 (${D.review.length})`]].map(([k,l])=>
      `<button role="tab" aria-selected="${tab===k}" onclick="tab='${k}';render()">${l}</button>`).join('')}
  </div>
  <div class="card">${tab==='students'?students():tab==='items'?items():review()}</div>`;
}

function students(){
  if(!D.students.length) return '<p class="muted">아직 응시한 학생이 없습니다. 학생에게 웹 앱 주소를 안내해 주세요.</p>';
  return `<div class="wrap"><table><thead><tr><th>반</th><th>번호</th><th>이름 / 계정</th>${D.concepts.map(c=>`<th>${esc(c.name)}</th>`).join('')}<th>재도전</th><th>완전학습</th><th>최근</th></tr></thead><tbody>
  ${D.students.map(s=>`<tr><td>${esc(s.cls)}</td><td>${esc(s.no)}</td><td>${esc(s.name||'')}<div class="muted" style="font-size:12px">${esc(s.email)}</div></td>
    ${s.scores.map(v=>`<td class="s ${v==null?'none':v>=D.mastery?'ok':'need'}">${pct(v)}</td>`).join('')}
    <td>${s.retries}회</td><td>${s.mastered?'달성':''}</td><td class="muted">${esc(s.updated)}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="muted">명부 시트에 이메일·반·번호·이름을 넣으면 이름이 함께 표시됩니다.</p>`;
}

function items(){
  const list = D.items.filter(it=>!conceptFilter || it.c===conceptFilter);
  return `<div class="filter"><span>개념</span><select onchange="conceptFilter=this.value;render()"><option value="">전체</option>
    ${D.concepts.map(c=>`<option value="${c.id}" ${conceptFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <span class="muted">평균 점수가 낮은 문항부터 보여 줍니다.</span></div>
  ${list.length?`<div class="wrap"><table><thead><tr><th>문항</th><th>개념</th><th style="width:44%">문제</th><th>응답</th><th>평균</th><th>자주 나온 오답</th></tr></thead><tbody>
  ${list.map(it=>`<tr><td>${it.id}</td><td>${esc(cname(it.c))}</td><td>${it.typeName?`<b>${esc(it.typeName)}</b><br>`:''}${esc(it.prompt)}</td><td>${it.n}</td>
    <td class="s ${it.avg>=D.mastery?'ok':'need'}">${pct(it.avg)}</td><td>${it.type==='text'?'<span class="muted">서술형</span>':esc(it.topWrong.join(', '))||'–'}</td></tr>`).join('')}
  </tbody></table></div>`:'<p class="muted">응답이 없습니다.</p>'}`;
}

function review(){
  if(!D.review.length) return '<p class="muted">확인할 서술형 답안이 없습니다.</p>';
  return `<p class="lead">자동 채점은 핵심 낱말로 매긴 점수입니다. 점수를 누르면 확정되고, 학생의 개념별 성취도 다시 계산됩니다.</p>
  <div class="wrap"><table><thead><tr><th>학생</th><th>문항</th><th style="width:48%">답안</th><th>점수 확정</th></tr></thead><tbody>
  ${D.review.map(r=>`<tr id="r${r.row}"><td>${esc(r.name||r.email)}<div class="muted" style="font-size:12px">${esc(r.time)}</div></td>
    <td>${r.id}<div class="muted" style="font-size:12px">${esc(r.prompt)}</div></td>
    <td><div class="ans">${esc(r.answer)}</div><div class="model">${esc(r.model)}</div></td>
    <td><div class="seg">${[0,0.5,1].map(v=>`<button class="${r.score===v?'on':''}" onclick="score(${r.row},${v},this)">${v}</button>`).join('')}</div>
      <div class="muted" style="font-size:12px">자동: ${r.score}</div></td></tr>`).join('')}
  </tbody></table></div>`;
}

async function score(row, v, btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    await call('setScore', row, v);
    D.review = D.review.filter(r=>r.row!==row);
    document.getElementById('r'+row).remove();
    if(!D.review.length) load();
  }catch(e){ alert(e.message||e); btn.parentElement.querySelectorAll('button').forEach(b=>b.disabled=false); }
}
load();
</script>
</body>
</html>
