<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청평초 단원평가</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4fa; --card:#ffffff; --ink:#1f2a44; --muted:#5b6478; --line:#d3deea;
  --sky:#2f6fb0; --sky-soft:#dceaf8; --ok:#0e7c66; --ok-soft:#dff3ec; --warn:#c2571a; --warn-soft:#fde9dc; --half:#a07a00; --half-soft:#fbf1cf;
  --head:"Jua","Gowun Dodum",sans-serif; --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;word-break:keep-all}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:var(--head);font-weight:400;line-height:1.3}
h1{font-size:32px;margin:8px 0 4px}
h2{font-size:24px;margin:0 0 10px}
.card{background:var(--card);border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 1px 0 var(--line)}
.muted{color:var(--muted);font-size:16px}
button{font-family:var(--head);font-size:20px;border:none;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--sky);color:#fff}
button.ghost{background:transparent;color:var(--sky);border:2px solid var(--sky)}
button.small{font-size:15px;padding:4px 12px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #f2b705;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* 내비게이션 */
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--sky);text-decoration:none;margin-bottom:4px}
.crumb:hover{text-decoration:underline}
.subjects{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:16px 0 4px}
.subjects button{flex:none;font-size:19px;padding:8px 18px;border-radius:999px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.subjects button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.term{font-family:var(--head);font-size:19px;color:var(--muted);margin:18px 4px 6px}
.units{display:grid;gap:10px}
.unit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-family:var(--body);font-size:18px;box-shadow:0 1px 0 var(--line)}
.unit:not(:disabled):hover{border-color:var(--sky)}
.unit .no{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sky-soft);color:var(--sky);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:22px}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-family:var(--head);font-weight:400;font-size:20px}
.unit .t span{font-size:15px;color:var(--muted)}
.badge{flex:none;font-family:var(--head);font-size:15px;border-radius:999px;padding:3px 12px;white-space:nowrap}
.badge.mastered{background:var(--ok-soft);color:var(--ok)}
.badge.progress{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--sky-soft);color:var(--sky)}
.badge.soon{background:var(--bg);color:var(--muted)}
.unit:disabled{opacity:.5;cursor:default;box-shadow:none;background:transparent;border:2px dashed var(--line)}
.unit:disabled .no{background:var(--line);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* 개념 풍선 */
.concepts{display:grid;gap:10px;margin-top:12px}
.concept{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.balloon{width:34px;height:42px;flex:none}
.concept b{font-family:var(--head);font-weight:400;font-size:19px}
.concept .st{margin-left:auto;font-size:15px;white-space:nowrap}
.st.ok{color:var(--ok)} .st.need{color:var(--warn)} .st.none{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px;width:100%}
.meter i{display:block;height:100%}

/* 문항 */
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sky);transition:width .25s}
.qhead{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin:8px 0}
.prompt{font-size:20px;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}
.opt input{margin-top:7px;width:20px;height:20px;flex:none}
.opt:has(input:checked){border-color:var(--sky);background:var(--sky-soft)}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mrow p{margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;background:var(--card);color:var(--ink);font-family:var(--body)}
.chip[aria-pressed="true"]{border-color:var(--sky);background:var(--sky);color:#fff}
select{font:inherit;font-size:17px;padding:8px;border-radius:10px;border:2px solid var(--line);width:100%;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:150px;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);resize:vertical}
textarea:focus{border-color:var(--sky);outline:none}
table{border-collapse:collapse;margin:8px 0 14px;font-size:16px}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:left}
th{background:var(--bg)}
ul.facts{margin:4px 0 12px;padding-left:1.2em}

/* 결과 · 보충 */
.res{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:none}
.mark{font-family:var(--head);font-size:15px;border-radius:8px;padding:2px 10px;height:fit-content;white-space:nowrap}
.mark.o{background:var(--ok-soft);color:var(--ok)} .mark.x{background:var(--warn-soft);color:var(--warn)} .mark.h{background:var(--half-soft);color:var(--half)}
.res p{margin:0}
.res .your{color:var(--muted);font-size:15px}
.res .exp{font-size:16px;margin-top:4px}
.review h3{font-size:22px;margin:0 0 6px}
.core{font-size:19px;background:var(--sky-soft);padding:10px 14px;border-radius:10px}
.wrongbox{background:var(--warn-soft);padding:10px 14px;border-radius:10px;margin-top:8px}
.wrongbox p{margin:4px 0;font-size:16px}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-family:var(--head);font-size:19px}
.check input{width:22px;height:22px}
.err{background:var(--warn-soft);color:var(--warn);padding:14px;border-radius:12px}
.celebrate{text-align:center}
.celebrate svg{width:180px;height:160px}
footer{text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중…</p></main>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.__gis=1;window.dispatchEvent(new Event('gis-loaded'))"></script>
<script src="api.js"></script>
<script>
const CIRC = ['①','②','③','④','⑤','⑥'];
const PALETTE = ['#6c8ebf','#e07a5f','#3d9970','#9b6ad1','#e0a800','#3a86c8','#c45b9a','#5a8f29'];
const STATUS = { mastered:'완전학습', progress:'보충 필요', none:'새 단원', soon:'준비 중' };
let catalog = null, subject = null;
let state = { unitId:null, home:null, test:null, idx:0, answers:{}, result:null };

const $app = document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function call(fn, ...args){ return api(fn, ...args); }
function fail(e){ $app.innerHTML = `<a class="crumb" href="#">← 단원 목록</a><div class="err">${esc(e && e.message || e)}</div>`; }
function pct(x){ return Math.round((x||0)*100); }
function color(i){ return PALETTE[i % PALETTE.length]; }
function unitLabel(u){ return `${esc(u.subject)} ${esc(u.term)} · ${esc(u.no)}단원`; }
function balloon(c, filled){
  return `<svg class="balloon" viewBox="0 0 34 42" aria-hidden="true">
    <ellipse cx="17" cy="15" rx="${filled?13:9}" ry="${filled?14:10}" fill="${filled?c:'none'}" stroke="${c}" stroke-width="2"/>
    <path d="M17 ${filled?29:25} l-2 3 h4 z" fill="${c}"/><path d="M17 ${filled?32:28} q-3 5 0 10" stroke="${c}" fill="none" stroke-width="1.5"/></svg>`;
}

// ── 화면 전환: 주소 끝 #단원ID ──
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openUnit(id); else showCatalog();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
function go(id){ if (location.hash.slice(1)===id) route(); else location.hash = id; }

// ── 단원 목록 ──
async function showCatalog(refresh){
  state.unitId = null;
  if (!catalog || refresh){
    $app.innerHTML = '<p class="muted">단원 목록을 불러오는 중…</p>';
    try{ catalog = await call('getCatalog'); }catch(e){ return fail(e); }
  }
  const subjects = [...new Set(catalog.units.map(u=>u.subject))];
  if (!subject || !subjects.includes(subject)){
    subject = subjects.find(s=>catalog.units.some(u=>u.subject===s && u.available)) || subjects[0];
  }
  const list = catalog.units.filter(u=>u.subject===subject);
  const terms = [...new Set(list.map(u=>u.term))].sort();
  const who = catalog.name ? `${esc(catalog.name)} 학생` : esc(catalog.email);
  $app.innerHTML = `
    <h1>청평초 단원평가</h1>
    <p class="muted">${who}, 공부할 단원을 골라 보세요.</p>
    ${subjects.length ? `<div class="subjects" role="tablist" aria-label="교과">${subjects.map(s=>
      `<button role="tab" aria-selected="${s===subject}" onclick="pickSubject('${esc(s)}')">${esc(s)}</button>`).join('')}</div>` : ''}
    ${terms.length ? terms.map(t=>`
      <h2 class="term">${esc(t.replace('-','학년 '))}학기</h2>
      <div class="units">${list.filter(u=>u.term===t).sort((a,b)=>Number(a.no)-Number(b.no)).map(unitCard).join('')}</div>`).join('')
      : '<div class="card empty">아직 등록된 단원이 없어요.</div>'}
    <footer><button class="ghost small" onclick="signOut()">다른 계정으로 로그인</button>
    ${catalog.teacher ? ' <a class="crumb" href="teacher.html">교사 화면</a>' : ''}</footer>`;
}
function unitCard(u){
  const sub = u.status==='soon' ? '문항을 준비하고 있어요'
    : u.status==='none' ? `개념 ${u.total}개`
    : `개념 ${u.total}개 중 ${u.done}개 완전학습`;
  return `<button class="unit" ${u.available?`onclick="go('${esc(u.id)}')"`:'disabled'} aria-label="${esc(u.no)}단원 ${esc(u.title)}, ${STATUS[u.status]}">
    <span class="no">${esc(u.no)}</span>
    <span class="t"><b>${esc(u.title)}</b><span>${sub}</span></span>
    <span class="badge ${u.status}">${STATUS[u.status]}</span></button>`;
}
function pickSubject(s){ subject = s; showCatalog(); }

// ── 단원 홈 ──
async function openUnit(id){
  state = { unitId:id, home:null, test:null, idx:0, answers:{}, result:null };
  $app.innerHTML = '<p class="muted">불러오는 중…</p>';
  try{ state.home = await call('getHome', id); renderHome(); }catch(e){ fail(e); }
}
function header(){
  const u = state.home.unit;
  return `<a class="crumb" href="#">← 단원 목록</a>
    <h1>${esc(u.title)}</h1><p class="muted">${unitLabel(u)}</p>`;
}
function conceptList(h){
  return `<div class="concepts">${h.concepts.map((c,i)=>{
    const st = c.score==null ? '<span class="st none">아직 안 풀었어요</span>'
      : c.mastered ? `<span class="st ok">완전학습 ${pct(c.score)}%</span>` : `<span class="st need">보충 필요 ${pct(c.score)}%</span>`;
    return `<div class="concept">${balloon(color(i), c.mastered)}<div style="flex:1"><b>${esc(c.name)}</b>
      ${c.score!=null?`<div class="meter"><i style="width:${pct(c.score)}%;background:${color(i)}"></i></div>`:''}</div>${st}</div>`;
  }).join('')}</div>`;
}
function renderHome(){
  const h = state.home;
  let action;
  if (!h.mainDone) action = `<p>모두 ${h.mainCount}문제예요. 개념마다 ${pct(h.threshold)}% 이상 맞히면 풍선이 가득 부풀어요.</p><button onclick="startTest()">평가 시작하기</button>`;
  else if (h.allMastered) action = `<p>이 단원의 개념을 모두 완전학습했어요. 정말 잘했어요!</p><a class="crumb" href="#">다른 단원 고르기 →</a>`;
  else action = `<p>아직 부풀지 않은 풍선이 있어요. 보충 학습을 읽고 다시 도전해 보세요.</p><button onclick="openReview()">보충 학습 하러 가기</button>`;
  $app.innerHTML = `${header()}
    <div class="card"><h2>나의 풍선 ${h.concepts.length}개</h2>${conceptList(h)}</div>
    <div class="card">${action}</div>`;
}

// ── 시험 ──
async function startTest(){
  $app.innerHTML = '<p class="muted">문제를 준비하고 있어요…</p>';
  try{
    state.test = await call('getTest', state.unitId);
    if (state.test.mode === '완료') return openUnit(state.unitId);
    state.idx = 0; state.answers = {};
    renderItem();
  }catch(e){ fail(e); }
}
function answered(q){
  const a = state.answers[q.id];
  if (q.type==='match') return Array.isArray(a) && a.length===q.rows.length && [...a].every(v=>v!==undefined && v!=='');
  if (q.type==='text') return !!(a && a.trim().length);
  return a!==undefined;
}
function renderItem(){
  const t = state.test, q = t.items[state.idx], n = t.items.length;
  const cname = (t.concepts.find(c=>c.id===q.c)||{}).name || '';
  let body = '';
  if (q.list) body += `<ul class="facts">${q.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if (q.table) body += `<table><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${q.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  const a = state.answers[q.id];
  if (q.type==='mc'){
    body += q.options.map((o,i)=>`<label class="opt"><input type="radio" name="mc" value="${i}" ${a===i?'checked':''} onchange="setAns(${i})"><span>${CIRC[i]} ${esc(o)}</span></label>`).join('');
  } else if (q.type==='match'){
    const cur = Array.isArray(a)?a:[];
    const useChips = q.choices.length<=3;
    body += q.rows.map((r,ri)=>`<div class="mrow"><p>${esc(r)}</p>${useChips
      ? `<div class="chips">${q.choices.map((c,ci)=>`<button type="button" class="chip" aria-pressed="${cur[ri]===ci}" onclick="setMatch(${ri},${ci})">${esc(c)}</button>`).join('')}</div>`
      : `<select onchange="setMatch(${ri}, this.value===''?'':Number(this.value))"><option value="">고르세요</option>${q.choices.map((c,ci)=>`<option value="${ci}" ${cur[ri]===ci?'selected':''}>${esc(c)}</option>`).join('')}</select>`
    }</div>`).join('');
  } else {
    body += `<textarea placeholder="여기에 써 보세요." oninput="state.answers['${q.id}']=this.value">${esc(a||'')}</textarea>`;
  }
  const last = state.idx===n-1;
  $app.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:${(state.idx+1)/n*100}%"></i></div>
    <div class="qhead"><span>${esc(state.home.unit.title)} · ${t.mode} · ${esc(cname)}</span><span>${state.idx+1} / ${n}</span></div>
    <div class="card"><p class="prompt"><b>${state.idx+1}.</b> ${esc(q.prompt)}</p>${body}</div>
    <div class="row">
      <button class="ghost" onclick="move(-1)" ${state.idx===0?'disabled':''}>이전</button>
      <span class="spacer"></span>
      ${last?'<button onclick="finish()">제출하기</button>':'<button onclick="move(1)">다음</button>'}
    </div>`;
}
function setAns(v){ state.answers[state.test.items[state.idx].id]=v; }
function setMatch(ri, ci){
  const q = state.test.items[state.idx];
  const arr = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : new Array(q.rows.length).fill('');
  arr[ri] = ci; state.answers[q.id] = arr;
  if (q.choices.length<=3) renderItem();
}
function move(d){ state.idx = Math.max(0, Math.min(state.test.items.length-1, state.idx+d)); renderItem(); window.scrollTo(0,0); }
async function finish(){
  const left = state.test.items.map((q,i)=>answered(q)?null:i+1).filter(Boolean);
  if (left.length && !confirm(`아직 답하지 않은 문제가 있어요: ${left.join(', ')}번\n그래도 제출할까요?`)) return;
  $app.innerHTML = '<p class="muted">채점하고 있어요…</p>';
  try{
    state.result = await call('submitTest', state.unitId, state.answers, state.test.items.map(q=>q.id));
    state.home = state.result.home;
    catalog = null; // 목록의 진행 상태를 새로 받도록
    renderResult();
  }catch(e){ fail(e); }
}

// ── 결과 ──
function markOf(s){ return s>=1?'<span class="mark o">맞음</span>':s>0?'<span class="mark h">절반</span>':'<span class="mark x">다시 보기</span>'; }
function renderResult(){
  const r = state.result, h = r.home;
  if (h.allMastered) return renderDone();
  const items = r.items.map((it,i)=>`<div class="res">${markOf(it.score)}<div>
      <p><b>${i+1}.</b> ${esc(it.prompt)}</p>
      <p class="your">내 답: ${esc(it.your)}</p>
      <p class="exp">${esc(it.explain)}${it.needsTeacher?' <span class="muted">(서술형은 선생님이 한 번 더 확인해요)</span>':''}</p></div></div>`).join('');
  $app.innerHTML = `${header()}
    <div class="card"><h2>${r.mode} 결과</h2>${conceptList(h)}</div>
    <div class="card"><button onclick="openReview()">보충 학습 하러 가기</button></div>
    <div class="card"><h2>문제 다시 보기</h2>${items}</div>`;
  window.scrollTo(0,0);
}

// ── 보충 학습 ──
async function openReview(){
  $app.innerHTML = '<p class="muted">보충 학습을 준비하고 있어요…</p>';
  try{
    const list = await call('getReview', state.unitId);
    if (!list.length) return openUnit(state.unitId);
    const idxOf = id => state.home.concepts.findIndex(c=>c.id===id);
    $app.innerHTML = `${header()}
      <p class="muted">아직 부풀지 않은 풍선의 핵심 내용이에요. 하나씩 읽고 체크하면 다시 도전할 수 있어요.</p>
      ${list.map(rv=>{
        const d = rv.data;
        return `<div class="card review"><div class="row">${balloon(color(idxOf(rv.id)), false)}<h3>${esc(rv.name)}</h3></div>
          ${d.core?`<p class="core">${esc(d.core)}</p>`:''}
          ${d.points?`<ul class="facts">${d.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
          ${d.table?`<div style="overflow-x:auto"><table>${d.tableHead?`<tr>${d.tableHead.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`:'<tr><th>기체</th><th>성질</th><th>쓰임</th></tr>'}${d.table.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:''}
          ${d.wrong && d.wrong.length?`<div class="wrongbox"><b>이렇게 착각하기 쉬워요</b>${d.wrong.map(w=>`<p>${esc(w)}</p>`).join('')}</div>`:''}
          <label class="check"><input type="checkbox" class="readchk" onchange="checkRead()"> 다 읽고 이해했어요</label></div>`;
      }).join('')}
      <div class="row"><button class="ghost" onclick="openUnit(state.unitId)">단원 처음으로</button><span class="spacer"></span><button id="retry" onclick="startTest()" disabled>다시 도전하기</button></div>`;
    window.scrollTo(0,0);
  }catch(e){ fail(e); }
}
function checkRead(){
  document.getElementById('retry').disabled = ![...document.querySelectorAll('.readchk')].every(c=>c.checked);
}

// ── 완전학습 ──
function renderDone(){
  const h = state.home, n = h.concepts.length;
  const balloons = h.concepts.map((c,i)=>{
    const x = 20 + (n===1?70:i*140/(n-1)), y = 30 + Math.abs(i-(n-1)/2)*10;
    return `<ellipse cx="${x}" cy="${y}" rx="16" ry="19" fill="${color(i)}"/><path d="M${x} ${y+19} Q${x-6} ${y+60} 90 150" stroke="${color(i)}" fill="none" stroke-width="1.5"/>`;
  }).join('');
  $app.innerHTML = `${header()}<div class="card celebrate">
    <svg viewBox="0 0 180 160" aria-hidden="true">${balloons}</svg>
    <h2>완전학습 달성!</h2><p>개념 ${n}개를 모두 ${pct(h.threshold)}% 이상 이해했어요.${h.retries?` 재도전 ${h.retries}번 끝에 해냈어요.`:''}</p>
    <a class="crumb" href="#">다른 단원 고르기 →</a></div>
    <div class="card"><h2>나의 풍선 ${n}개</h2>${conceptList(h)}</div>`;
  window.scrollTo(0,0);
}

route();
</script>
</body>
</html>
